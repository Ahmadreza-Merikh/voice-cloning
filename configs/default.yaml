# ============================================================================
#  Persian Voice Cloning Studio - default configuration
# ----------------------------------------------------------------------------
#  Every value here can be overridden by:
#    1. a custom YAML passed with --config / VOICECLONE_CONFIG
#    2. environment variables of the form VOICECLONE__SECTION__KEY
#       e.g. VOICECLONE__RUNTIME__DEVICE=cpu
#    3. explicit arguments in the UI / CLI
#
#  Defaults are tuned for QUALITY over speed, as the project brief requires.
# ============================================================================

paths:
  # Model weights, vocoders and derived caches. Keeps the repo clean.
  cache_dir: ~/.cache/persian-voice-cloning
  output_dir: outputs
  voices_dir: voices

runtime:
  # Apple Silicon note: PyTorch's Metal backend has an intermittent crash in
  # its `abs()` kernel (observed on torch 2.13), which takes the whole process
  # down mid-synthesis with "Bus error: 10". It is not deterministic and gets
  # more likely under memory pressure. If you hit it, set `device: cpu` - it is
  # slower but reliable, and the output is identical.
  device: auto              # auto | cuda | mps | cpu
  dtype: auto               # auto | float32 | float16 | bfloat16
  seed: 0                   # 0 => a fresh random seed on every run
  # Cap intra-op threads on CPU. 0 leaves PyTorch's own heuristic alone.
  num_threads: 0
  # Apple Silicon: allow ops without an MPS kernel to fall back to CPU
  # instead of raising. Costs a little speed, avoids hard crashes.
  mps_fallback: true
  # macOS publishes a system-wide memory-pressure level. With this on, no
  # render starts while it is at warning, and an out-of-process engine
  # (OmniVoice) is stopped the moment it gets there, with a message, instead
  # of letting a 16 GB Mac with no swap thrash. Measured on 2026-09-19: an
  # OmniVoice load took this machine to warning with other apps open.
  # Elsewhere no level exists and this does nothing.
  stop_on_memory_pressure: true

audio:
  # Working sample rate of the synthesis graph. F5-TTS/Vocos operate at 24 kHz;
  # everything is resampled to this rate internally and back out on save.
  sample_rate: 24000

  reference:
    # Zero-shot cloners condition on a short prompt. Too short => unstable
    # timbre; too long => the model starts copying the prompt's prosody and
    # (for F5) risks truncation. 8-12 s of clean, continuous speech is ideal.
    target_seconds: 10.0
    min_seconds: 3.0
    max_seconds: 20.0
    # Automatically pick the highest-quality window of a long recording
    # instead of blindly taking the first N seconds.
    auto_select_window: true
    # Reject a reference outright if measured quality falls below this
    # 0-100 score, rather than producing a bad clone silently.
    min_quality_score: 25.0

  preprocess:
    to_mono: true
    remove_dc: true
    highpass_hz: 55.0        # kill rumble/handling noise below speech F0
    lowpass_hz: null         # null => disabled
    # Separate the voice from music/background with Demucs before cloning.
    # Expensive; enable only for references taken from songs or noisy video.
    separate_vocals: false
    denoise: auto            # auto | deepfilternet | noisereduce | none
    denoise_strength: 0.8    # 0..1, applies to the noisereduce backend
    dereverb: false          # requires the DeepFilterNet backend
    trim_silence: true
    vad_backend: auto        # auto | silero | energy | none
    vad_threshold: 0.5
    # Collapse pauses longer than this (seconds) inside the reference clip.
    max_internal_silence: 0.35
    # Leave a little air around retained speech so words are not clipped.
    vad_pad_ms: 120
    loudness_lufs: -23.0     # EBU R128 target for the *reference* prompt
    peak_dbfs: -1.5

  output:
    loudness_lufs: -18.0     # slightly hotter for delivery
    peak_dbfs: -1.0
    fade_ms: 12              # de-click fades on the final render
    # Chunked long-form synthesis is stitched with an equal-power crossfade.
    join_crossfade_ms: 40
    # Silence inserted between sentences/chunks for natural phrasing.
    sentence_gap_ms: 180
    paragraph_gap_ms: 380
    format: wav              # wav | flac | mp3
    bit_depth: 24            # for wav/flac

text:
  language: auto             # auto | fa | en
  normalize: true
  expand_numbers: true
  # Strip bracketed director's notes such as [laughter] before synthesis.
  strip_bracketed_tags: true

  g2p:
    # Persian orthography omits short vowels, marks ezafe invisibly and is
    # full of homographs. Feeding PHONEMES instead of raw script is the single
    # biggest win for Persian pronunciation accuracy.
    enabled: auto            # auto (use if available) | true (require) | false
    # Path to the Homo-GE2PE based Persian G2P project. `auto` searches a few
    # well-known locations; set explicitly to be safe.
    repo_path: auto
    inject_ezafe: true
    # `ipa`    -> emit IPA, normalised into the canonical convention below
    # `native` -> keep the G2P's own romanisation
    # `off`    -> pass graphemes straight through
    output: ipa
    # Engines whose tokenizer is grapheme-only still benefit from
    # normalisation but must not receive phonemes.
    #
    # Only omnivoice_ipa is listed. Its weights were continued on canonical
    # Persian IPA (christopherthompson81/omnivoice-ipa-onnx, built by
    # scripts/build_omnivoice_ipa.py), so IPA in that convention is its
    # native input; the text pipeline converts Homo-GE2PE's output for it
    # (src/voiceclone/text/ipa_normalize.py).
    #
    # Deliberately absent, both measured:
    #   MOSS - its phoneme channel is trained on English (CMUdict) and Chinese
    #   pinyin; upstream's own examples are all English. Persian IPA is out of
    #   distribution and it collapses: the same sentence that renders in 7.3s
    #   from Persian script came back as 1.3s of nonsense from IPA, 100% WER
    #   against 40%. Measured on an M1 Pro, MOSS-TTS-Local, Mana reference.
    #   F5 and the rest - grapheme tokenizers; IPA would be out-of-vocabulary
    #   noise for them.
    # Add an engine here only once it is measured to read Persian phonemes
    # better than Persian script.
    apply_to_engines: [omnivoice_ipa]

  # Engines that read Persian marks from the script. For them the normaliser
  # keeps أ (تأخیر - mapped to ا, OmniVoice said taa'khir) and writes ۀ as هٔ
  # (a bare ه drops the ezafe), and the ezafe is written in below. Only
  # OmniVoice was heard doing this (FINDINGS sections 13-15); add an engine
  # only once it is heard reading marks.
  marks_engines: [omnivoice]

  ezafe:
    # The ezafe is the -e/-ye plain script does not write. hazm's ParsBERT
    # tagger places it (1.7% of words wrong on unseen SentenceBench sentences,
    # FINDINGS §14) and it is written as a kasra, هٔ or ی. Heard blind: 9 words
    # of 147 wrong against 12 on plain script, CER not raised (FINDINGS §15).
    # The sukun and first-vowel marks were heard too and are not used.
    #   auto  -> write it when the tagger can run, plain script otherwise
    #   true  -> stop if it cannot run;  false -> never
    enabled: auto
    # The tagger runs without spaCy (text/ezafe_tagger.py; the same decision
    # on all 414 sentences checked) from a one-time export kept here, ~620 MB.
    export_dir: ~/.cache/persian-voice-cloning/ezafe-tagger
    download: true
    # It loads for one text and is released after it: 0.86 GB at its peak.
    # Not started with less than this available; the one-time export needs
    # 1.5 GB more.
    min_available_gb: 1.5

  homographs:
    # The first short vowel of a homograph (مُهر / مِهر, شُکر / شِکر), read
    # from the whole sentence by Homo-GE2PE (the G2P above) and written for the
    # same engines, on HomoRich's 190 homographs that it tells apart (CC0,
    # text/homographs_data.py; not the preposition به, which every mark broke).
    # Heard blind: homographs wrong 8 of 23 against 14, words 25 of 242
    # against 27, CER and similarity unharmed (FINDINGS §17).
    #   auto -> write them when Homo-GE2PE can run;  true -> stop if it
    #   cannot;  false -> never
    enabled: auto
    # Loaded for one text and released: 0.66 GB at its peak, 5.5 s to load.
    min_available_gb: 1.0

  chunk:
    # Long text is split on sentence boundaries and synthesised in pieces so
    # quality never degrades over a long take.
    max_chars: 220
    max_seconds: 22.0
    # Never split below this, to avoid one-word fragments with odd prosody.
    min_chars: 24

engines:
  # OmniVoice: the highest held-out similarity measured here (0.583 against
  # 0.546 for the best F5 configuration, FINDINGS §8), CER not detectably
  # different. On a 16 GB Mac it needs the reference transcript typed in (see
  # memory_guard below); the app falls back to F5 where OmniVoice is not
  # installed.
  tts: omnivoice             # omnivoice | omnivoice_ipa | f5 | moss | fish | higgs | chatterbox | moss15
  vc: cascade                # cascade | seedvc

  f5:
    # Persian-finetuned F5-TTS. Grapheme (character) tokenizer covering the
    # Persian alphabet; fast and light (~330 M params).
    model_arch: F5TTS_v1_Base
    checkpoint: hf://Lumos675/F5_TTS_Persian/model_last.pt
    vocab: hf://Lumos675/F5_TTS_Persian/vocab.txt
    # Fall back to the multilingual base model if the Persian one is absent.
    fallback_checkpoint: hf://SWivid/F5-TTS/F5TTS_v1_Base/model_1250000.safetensors
    vocoder: vocos           # vocos | bigvgan
    # Quality knobs. nfe_step is the flow-matching ODE budget: higher = slower.
    # 32 is upstream; 48 was the working default; 64 is the UI "Maximum quality"
    # preset. On this project's F5 sweep, 64 vs 48 did not move identity, and
    # is kept as the quality-first budget rather than a measured gain.
    nfe_step: 64
    cfg_strength: 2.0
    sway_sampling_coef: -1.0
    speed: 1.0
    # Remove the leading reference audio the model echoes back.
    cross_fade_duration: 0.15

  moss:
    # Highest-quality option: official Persian support, zero-shot cloning and
    # direct IPA phoneme input. 1.7B "Local" fits in ~3.5 GB at bf16.
    model_id: OpenMOSS-Team/MOSS-TTS-Local-Transformer
    # Swap for the 8B flagship on a >=24 GB GPU:
    #   model_id: OpenMOSS-Team/MOSS-TTS
    # Upstream ships 1.0, which is a *creative* setting; this is a fidelity
    # task. Measured over a 3x3 temperature/seed grid on one reference,
    # scoring every take by round-trip WER:
    #     temp 1.0 -> 24.5% mean WER      temp 0.8 -> 15.6%      temp 0.6 -> 11.1%
    # Speaker similarity barely moves across that range (0.777 / 0.793 /
    # 0.780), so the whole effect is intelligibility. 0.6 is the single-take
    # setting (best-of-N is off: OmniVoice cannot rank takes on this 16 GB Mac).
    temperature: 0.6
    top_p: 0.95
    top_k: 50
    repetition_penalty: 1.1
    max_new_tokens: 4096

  pocket:
    # Pocket-TTS Farsi v2: the only Persian-SPECIFIC model measured here.
    # 109.5M parameters distilled from Kyutai's pocket-tts, trained on 973 h
    # from 2,978 speakers - 7.6x the 128 h of this project's own adaptation -
    # and fast on a CPU. Its authors report median per-item WER 0.333,
    # speaker similarity 0.859 and UTMOS 3.11 on 300 held-out Common Voice
    # pairs; none of those numbers is comparable with this project's, which is
    # why the engine is here rather than the claim.
    #
    # It reads ROMANISED PHONEMES. Persian script renders as silence with no
    # error, so the worker phonemises with the G2P its card names
    # (Homo-GE2PE - the same family as the Persian G2P research bridged to in
    # text/g2p.py). Both revisions are pinned; fetch with
    # `scripts/fetch_inputs.py --plan eval/plans/pocket_tts.json`.
    #
    # Licence: model CC-BY-NC-4.0, G2P MIT. Needs its own environment:
    #   uv venv --python python3.11 ~/.cache/persian-voice-cloning/pocket/.venv
    #   VIRTUAL_ENV=... uv pip install \
    #     "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main" transformers soundfile
    python: auto
    model_dir: ~/.cache/persian-voice-cloning/pocket/model
    g2p_dir: ~/.cache/persian-voice-cloning/pocket/g2p
    revision: e87097ed98edb8bd9c9bcabe9b575a51a466d0e4
    g2p_revision: e314087bc761e323d127ee7899cb34f7c7d697cd
    # The card's safe chunk budget: its training utterances averaged about 11
    # tokens, 9-16 is the clean band, and at 21 generations stop terminating.
    max_tokens: 18
    retries: 1
    timeout_seconds: 600.0

  longcat:
    # LongCat-AudioDiT (Meituan, arXiv 2603.29339, MIT): a diffusion
    # transformer in a waveform VAE's latent space, 1B and 3.5B. Its 3.5B
    # has the highest WavLM similarity on Seed-TTS-eval; the same eval scored
    # with ERes2Net, or given noisy prompts, puts it behind three others
    # (arXiv 2607.23938). CHINESE AND ENGLISH ONLY - its training data and its
    # maintainers' answer - so it is measured here with English text against
    # OmniVoice, never used for Persian.
    #
    # Official inference is fp32 on CUDA; the engine refuses anything else.
    # Not a package: the kernel fetches audiodit/ and utils.py at commit
    # 12c76b51 and google/umt5-base's tokenizer, and runs them in the
    # interpreter OmniVoice's stack is installed in (transformers 5.3.0).
    python: auto
    model_dir: ~/.cache/persian-voice-cloning/longcat/model
    code_dir: ~/.cache/persian-voice-cloning/longcat/code
    tokenizer_dir: ~/.cache/persian-voice-cloning/longcat/umt5-base
    # The README's voice-cloning call (the maintainers' answer to issue #3).
    nfe: 16
    guidance_strength: 4.0
    guidance_method: apg
    # Empty keeps everything on one device, as upstream does. The 3.5B's fp32
    # transformer goes on the second GPU of a T4 pair: placement, not precision.
    transformer_device: ""
    timeout_seconds: 900.0

  chatterbox:
    # Chatterbox splits the job F5 does in one model: a voice encoder and
    # S3Gen carry speaker identity and never see Persian text, while T3 - a
    # 0.5B Llama - turns characters into speech tokens and is the only
    # language-specific part. `t3_checkpoint` replaces just that part.
    #
    # The point of the arrangement: measurement puts F5's identity transfer
    # 0.17 below the human ceiling while its pronunciation already beats the
    # corpus. Here the speaker path does not depend on how much Persian data
    # anyone had.
    #
    # Needs its own environment - it pins torch 2.6 / transformers 5.2 /
    # numpy<2, which cannot coexist with F5-TTS:
    #   python3.11 -m venv ~/.cache/persian-voice-cloning/chatterbox/.venv
    #   ~/.cache/.../chatterbox/.venv/bin/pip install chatterbox-tts
    #
    # The Persian T3 is gated: accept the licence on the model page while
    # signed in, then `hf auth login`. Without it the engine still runs on the
    # base checkpoint and says so - Persian read with an English mouth.
    python: auto
    t3_checkpoint: hf://Thomcles/Chatterbox-TTS-Persian-Farsi/t3_fa.safetensors
    # The multilingual stack needs a language tag; Persian is not one of its 23,
    # and Arabic is the nearest script. Revisit if measurement prefers another.
    language_id: ar
    exaggeration: 0.5        # 0.5 is neutral; higher is theatrical and less stable
    cfg_weight: 0.5          # lower slows the delivery
    temperature: 0.8
    repetition_penalty: 1.2
    min_p: 0.05
    top_p: 1.0
    timeout_seconds: 900

  omnivoice:
    # k2-fsa OmniVoice (arXiv 2604.00688): diffusion-language-model TTS trained
    # on 581k hours across 600+ languages. Chosen by checking the landscape
    # live, not from memory. Verified against its own paper and model card:
    #   - Persian is a training language; FLEURS Persian CER 1.90% vs 1.57%
    #     for the ground-truth recordings
    #   - on identical training data it beats F5-TTS on every SIM test set
    #     its authors report
    #   - Apache-2.0, 3.3 GB, Apple Silicon a documented target
    # Its SIM numbers use a WavLM-based extractor on other corpora and are not
    # comparable to this project's. The benchmark decides.
    #
    # Brings its own torch/transformers, so it runs in its own environment:
    #   uv venv --python python3.11 ~/.cache/persian-voice-cloning/omnivoice/.venv
    #   VIRTUAL_ENV=~/.cache/.../omnivoice/.venv uv pip install omnivoice
    python: auto
    model_id: k2-fsa/OmniVoice
    # Which weights OmniVoice reads with. The ezafe check
    # (eval/runs/persian-voice-omnivoice-ezafe-train.json) heard the adaptation
    # trained on transcripts with every ezafe written, at step 1,000, read the
    # app's text with fewer words wrong than the first adaptation's step-1,000
    # export the app read with before, 6 against 16 of 165, and nothing flagged it.
    #   auto       the export when adapted_dir holds it, verified by sha256, and
    #              model_id is the published one; else model_id, with a warning
    #              in the output when the export is missing
    #   adapted    refuse to start without the export
    #   published  always model_id
    # Fetch it with: .venv/bin/python scripts/fetch_adapted_weights.py (about 2 GB)
    weights: auto
    adapted_dir: ~/.cache/persian-voice-cloning/omnivoice/adapted/omnivoice-fa-ezafe-1000-float16
    adapted_sha256: 136aac641d2e04c24c8c081bcefd8ceccf310969b065ef510a5fc2903d720e2b
    language: fa
    # Upstream's inference dtype. It loads straight onto Metal: what aborted the
    # process was transformers' threaded weight loading, and the worker switches
    # that pool off before importing it. Measured, each load in its own process:
    # pool on aborts; pool off loads in 3.8s at 1.97 GB peak, against 4.39 GB
    # for the cast-on-CPU-then-move it replaces.
    dtype: float16
    # Upstream `omnivoice-infer` defaults - the configuration the paper measured.
    num_step: 32
    guidance_scale: 2.0
    t_shift: 0.1
    denoise: true
    postprocess_output: true
    layer_penalty_factor: 5.0
    position_temperature: 5.0
    class_temperature: 0.0
    timeout_seconds: 900
    # The worker and the speech recogniser do not fit together on a 16 GB Mac:
    # measured, a render that had to transcribe its reference reached warning
    # memory pressure, one given the transcript peaked at 3.4 GB with none.
    # With this on, nothing that loads the recogniser beside OmniVoice starts:
    # the reference transcript must be supplied, and best-of-N and
    # speech-to-speech are refused. Turn it off on a machine with room for both.
    memory_guard: true
    # Load a verified float16 copy of the cached weights where one exists for
    # the same revision (scripts/omnivoice_float16.py): the worker casts every
    # weight to float16 on load anyway, so the numbers are identical and the
    # file read is half the size.
    float16_copy: true
    # Refuse to start the worker with less than this much memory available
    # (GB); 0 disables the check. An estimate from this Mac on 2026-09-19:
    # warning pressure arrived when available memory fell to 3.05-3.37 GB
    # (three times), and the worker needs about 2-3 GB on top. The pressure
    # watch applies either way.
    min_available_gb: 6.0

  omnivoice_ipa:
    # EXPERIMENT: OmniVoice continued on canonical Persian IPA
    # (christopherthompson81/omnivoice-ipa-onnx, CC-BY-NC-4.0 - the base above
    # stays Apache-2.0). The published diff is folded into a local copy of the
    # base weights once, then select it with --engine omnivoice_ipa:
    #     <python> scripts/build_omnivoice_ipa.py
    # Provenance of the merged weights is written beside them in
    # IPA_ADAPTATION.json.
    #
    # Everything else - worker, virtualenv, generation defaults,
    # memory_guard - is inherited from `omnivoice` above, so a render under
    # this engine differs from one under `omnivoice` only in the weights and
    # in the phonemes text.g2p hands over (apply_to_engines above).
    model_dir: omnivoice-ipa      # relative to paths.cache_dir
    float16_copy: false           # a local directory: nothing to mirror

  fish:
    # Fish Audio S2 Pro (arXiv 2603.08823): dual-autoregressive TTS, a 4B slow
    # transformer over time plus a 400M fast one filling 9 residual codebooks
    # per frame, trained on 10M+ hours across 80+ languages. Persian is in the
    # third tier - tier 1 is ja/en/zh, tier 2 another seven - so its headline
    # Seed-TTS numbers are not a Persian claim. The benchmark decides.
    #
    # Fish Audio Research License: research and non-commercial use only, unlike
    # every other engine here. Winning does not make it shippable.
    #
    # Pins torch 2.8 and transformers <=4.57, so it runs in its own environment:
    #   git clone https://github.com/fishaudio/fish-speech ~/.cache/persian-voice-cloning/fish
    #   uv venv --python python3.12 ~/.cache/persian-voice-cloning/fish/.venv
    #   VIRTUAL_ENV=~/.cache/.../fish/.venv uv pip install -e ~/.cache/persian-voice-cloning/fish
    python: auto
    checkpoint: fishaudio/s2-pro   # about 11 GB on first use
    # Upstream's dtype. A GPU with no bfloat16 unit (Turing, so the T4) loads
    # float16 instead - upstream's own --half - and the results say which ran.
    precision: bfloat16
    # Bounds the KV cache and how far generation may run. The checkpoint says
    # 32768, which reserves ~4.8 GB in 16-bit on top of 9.1 GB of weights and a
    # 1.9 GB codec. At ~21 frames/s this is still about three minutes of speech.
    max_seq_len: 4096
    # Upstream CLI defaults - the configuration upstream ships.
    temperature: 1.0
    top_p: 0.9
    top_k: 30
    repetition_penalty: 1.1
    chunk_length: 300
    max_new_tokens: 1024     # ~48 s of audio: a bound on a render that never stops
    timeout_seconds: 900

  higgs:
    # Boson AI Higgs TTS 3: a Qwen3-4B backbone with a fused 8-codebook audio
    # head. Persian is in the model card's top tier - the 85 languages it calls
    # "WER/CER under 5" - and on its own multilingual table it reports the
    # lowest error of eleven systems, three of which this project has measured.
    # That table is the vendor's own; the benchmark decides.
    #
    # Research and non-commercial licence, with a separate grant covering the
    # output. Narrower than every other engine here except Fish.
    #
    # Boson ships it for SGLang-Omni or vLLM-Omni, which want compute 8.0 - the
    # free T4 is 7.5. This loads a transformers port of the same checkpoint
    # instead: weights verified identical by sha256, modeling code read, and the
    # revision pinned below because it runs with trust_remote_code.
    #   uv venv --python python3.11 ~/.cache/persian-voice-cloning/higgs/.venv
    #   VIRTUAL_ENV=~/.cache/.../higgs/.venv uv pip install "transformers>=5.5" torch torchaudio soundfile
    python: auto
    model_id: multimodalart/higgs-audio-v3-tts-4b-transformers
    revision: 30f01593ee6a12efa586c92455afe4b76e45095d
    # The codec runs in fp32 whatever this says - it is unstable in 16-bit, and
    # that is the likely cause of the all-constant renders Turing produced
    # through the vendor's own serving stack.
    dtype: bfloat16
    # Boson's own serving example.
    temperature: 0.8
    top_p: null
    top_k: 50
    max_new_tokens: 1024     # about 43 s of audio
    timeout_seconds: 900

  moss15:
    # MOSS-TTS-Local-Transformer-v1.5 (OpenMOSS). Model, codec
    # (MOSS-Audio-Tokenizer-v2) and code all Apache-2.0, checked at the
    # revisions pinned in scripts/moss15_worker.py, whose remote code was read.
    # Official recipe: transformers 5.0.0, bf16 on CUDA (emulated on a T4 -
    # the official precision run slowly, never swapped for fp16), SDPA without
    # FlashAttention on cards below compute 8.0, 48 kHz stereo, 12 codebooks.
    #   uv venv --python python3.12 ~/.cache/persian-voice-cloning/moss15/.venv
    #   VIRTUAL_ENV=~/.cache/.../moss15/.venv uv pip install "torch==2.9.1" \
    #       "torchaudio==2.9.1" "transformers==5.0.0" "accelerate>=1.10.1" soundfile
    python: auto
    language: "Persian (Farsi)"  # the official v1.5 app's own string (clis/moss_tts_local_v1.5_app.py at 934d6826)
    # The card's recommended sampling.
    audio_temperature: 1.7
    audio_top_p: 0.8
    audio_top_k: 25
    audio_repetition_penalty: 1.0
    max_new_tokens: 4096
    codec_device: auto         # second GPU when present - placement, not precision
    native_dir: outputs/native/moss15
    timeout_seconds: 1800

  asr:
    # Used to auto-transcribe the reference clip (F5-TTS needs the reference
    # transcript) and to drive the speech-to-speech cascade.
    backend: faster-whisper  # faster-whisper | transformers
    model: large-v3-turbo
    compute_type: auto       # auto | int8 | float16 | float32
    language: fa
    beam_size: 5
    # Whisper invents text over silence. Off on this corpus raised mean CER
    # from 7.8% to 11.9% (one clip came back in Icelandic). Completeness is
    # extra VAD padding, not disabling the gate.
    vad_filter: true
    no_speech_threshold: 0.6
    initial_prompt: ""
    # faster-whisper stock. Extra pad was measured on this corpus at 8.16%
    # CER against 7.80% stock and is not the default.
    vad_threshold: 0.5
    vad_min_silence_ms: 2000
    vad_speech_pad_ms: 400

  seedvc:
    # True acoustic voice conversion: keeps the source prosody/emotion and
    # timing, swaps only the timbre. Language-agnostic, so it handles Persian.
    # Seed-VC pins older transformers/numpy, so it is driven out-of-process
    # in its own interpreter. Point `python` at that env's binary.
    repo_path: auto          # auto => look for ~/seed-vc
    python: auto             # auto => <repo>/.venv/bin/python, else sys.executable
    diffusion_steps: 75      # UI "Maximum quality" budget (upstream default is 30)
    length_adjust: 1.0
    inference_cfg_rate: 0.7
    f0_condition: false      # enable for singing / strongly pitched material
    auto_f0_adjust: false
    semi_tone_shift: 0
    timeout_seconds: 900

evaluation:
  # Objective feedback shown next to every render so quality is measurable,
  # not guessed. All of it is optional and degrades gracefully.
  enabled: true
  speaker_similarity: true   # ECAPA-TDNN / Resemblyzer cosine vs. reference
  transcribe_check: false    # re-run ASR on the output and report WER/CER

  # Best-of-N. Autoregressive engines vary a lot between seeds - more, in
  # measurement, than any sampling knob moves them - so rendering several
  # takes and keeping the best is the cheapest quality win available without
  # a new model. 1 disables it.
  #
  # Measured on the nine-speaker benchmark, F5 on MPS, 27 renders: best-of-4
  # scores 0.533 held-out against 0.520 for a single take, at 60 minutes
  # against 15. Paired cell by cell, it changed the chosen take in 10 of 27
  # cases and improved 9 of those (mean +0.046, best +0.118); one got worse.
  # CER was unaffected, 2.9% -> 2.8%.
  #
  # That is the only intervention measured on this project that moves identity
  # transfer at all - every inference knob is inside the noise - but it buys
  # back about 8% of the gap to the human ceiling for 4x the wall clock. Left
  # at 1 for iteration; raise it for final renders.
  candidates: 1
  # Round-trip CER is clamped here before takes are compared, so anything at
  # or below counts as equally intelligible and speaker similarity picks
  # between them.
  #
  # This was WER until WER was shown to be scoring typography: Persian
  # compounds have no fixed spacing, and Whisper transcribing *real human
  # speech* from this project's corpus against its own transcripts scores
  # 37.4% WER. Ranking takes on that ranked whitespace. On the same clips CER
  # is 7.8%, which is where this floor sits - differences under it are the
  # recogniser, not the render. Above it the difference is real and CER decides.
  candidate_cer_floor: 0.08
  # Speaker-similarity differences below this count as a tie. 0 disables the
  # quantisation and compares raw scores. Perturbing one
  # render in ways that cannot change who is speaking - cropping 85-95% of it,
  # +/-1 dB of gain, dither at -60 dBFS - moves the ECAPA score by up to
  # 0.0205 (sd 0.0055). The entire temperature sweep moved it by 0.016, i.e.
  # that comparison was inside the noise as well.
  candidate_similarity_step: 0.02

ui:
  server_name: 127.0.0.1
  server_port: 7860
  share: false
  language: fa               # fa | en - UI chrome language (content is either)
  theme: soft
  max_upload_mb: 200
  show_diagnostics: true
